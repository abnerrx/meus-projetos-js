<!DOCTYPE html>
<html>
<head>
    <title>Jogo da Velha</title>
</head>

<body>
    <h1>Jogo da Velha</h1>
    <button id="1.1"></button>
    <button id="1.2"></button>
    <button id="1.3"></button>
    <br>
    <button id="2.1"></button>
    <button id="2.2"></button>
    <button id="2.3"></button>
    <br>
    <button id="3.1"></button>
    <button id="3.2"></button>
    <button id="3.3"></button>
    <br>

    <script>
        let casasLivres = [];
        let jogoacabou = false;
        let jogada = 0;
        let vitorias = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];
        let botoes = [
            {
                id: "1.1",
                indice: 0
            },
            {
                id: "1.2",
                indice: 1
            },
            {
                id: "1.3",
                indice: 2
            },
            {
                id: "2.1",
                indice: 3
            },
            {
                id: "2.2",
                indice: 4
            },
            {
                id: "2.3",
                indice: 5
            },
            {
                id: "3.1",
                indice: 6
            },
            {
                id: "3.2",
                indice: 7
            },
            {
                id: "3.3",
                indice: 8
            }
        ];

        let tabuleiro = [
            null, null, null,
            null, null, null,
            null, null, null
        ];


        function verificarVitoria(){
            for (let j = 0; j < 8; j++){
            let contadorX = 0;
            let contadorO = 0;

            for (let k = 0; k < 3; k++){
                if (tabuleiro[vitorias[j][k]] == "X"){
                contadorX++;
                }

                if (tabuleiro[vitorias[j][k]] == "O"){
                    contadorO++;
                }
        }

            if (contadorX == 3){
                console.log("X venceu!");
                jogoacabou = true;
            }

            if (contadorO == 3){
                console.log("O venceu!");
                jogoacabou = true;
            }
        }

        if (jogada == 9){
            console.log("Empate!");
            jogoacabou = true;
        }
    }
            for (let i = 0; i < 9; i++){
                let botao = document.getElementById(botoes[i].id)
                botao.onclick = function(){
                    casasLivres = [];
                    
                    if (jogoacabou == true){
                        return;
                    }   

                    if (tabuleiro[botoes[i].indice] == null){
                        if (jogada % 2 == 0){
                            botao.textContent = "X";
                            tabuleiro[botoes[i].indice] = "X"
                            jogada++
                    }
                }

                if (jogada % 2 != 0){
                    for (let k = 0; k < 9; k++){
                        if (tabuleiro[k] == null){
                            casasLivres.push(k);
                        }
                    }
                    let escolha = Math.floor(Math.random() * casasLivres.length);
                    let casaEscolhida = casasLivres[escolha];
                    let botao2 = document.getElementById(botoes[casaEscolhida].id);
                    botao2.textContent = "O";
                    tabuleiro[casaEscolhida] = "O";
                    jogada++;
                }
                verificarVitoria();
            }
        }             



         
    </script>
</body>
</html>
