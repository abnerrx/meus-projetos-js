<!DOCTYPE html>
<html>
<head>
    <style>
    body {
        display:flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: rgb(41, 40, 40);
        color: white;
    }

    h1 {
        color: white;
    }

    #visor {
        background: rgb(41, 40, 40);
        color: white;
        width: 210px;
        height: 30px;
        margin: 4px;
        font-size: 20px;
        border-radius: 4px;
        border: 1px solid white;
    }

    button {
        background: rgb(60, 58, 58);
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        margin: 5px;
        font-size: 20px;
        cursor: pointer;
        border: none;
    }

    #calculadora{
        background: rgb(30, 30, 30);
        padding: 20px;
        border-radius: 12px;
    }


</style>
    <title>Calculadora</title>
</head>

<body>
    <div id="calculadora">
        <h1>Calculadora</h1>
        <input id="visor">
        <br>
        <button id="sete">7</button>
        <button id="oito">8</button>
        <button id="nove">9</button>
        <button id="divisao">/</button>
        <br>
        <button id="quatro">4</button>
        <button id="cinco">5</button>
        <button id="seis">6</button>
        <button id="multiplicacao">*</button>
        <br>
        <button id="um">1</button>
        <button id="dois">2</button>
        <button id="tres">3</button>
        <button id="subtracao">-</button>
        <br>
        <button id="limpar">C</button>
        <button id="zero">0</button>
        <button id="resultado">=</button>
        <button id="soma">+</button>
        </div>
    <script>
    let numero1;
    let numero2;
    let operacao = null;
    let resultado = null;

    let operadores = [
        {
            id: "divisao",
            nome: "divisão",
            simbolo: "/"
        },
        {
            id: "multiplicacao",
            nome: "multiplicação",
            simbolo: "*"
        },
        {
            id: "subtracao",
            nome: "subtração",
            simbolo: "-"
        },
        {
            id: "soma",
            nome: "soma",
            simbolo: "+"
        }
    ];

    let numeros_string = [
        "zero",
        "um",
        "dois",
        "tres",
        "quatro",
        "cinco",
        "seis",
        "sete",
        "oito",
        "nove"
    ];

    let visor = document.getElementById("visor");
    visor.value = "";

    for (let i = 0; i < 10; i++){
        let botao = document.getElementById(numeros_string[i]);

        botao.onclick = function(){
            visor.value += i;
        }
    }

    for (let i = 0; i < 4; i++){
        let botao_operador = document.getElementById(operadores[i].id);

        botao_operador.onclick = function(){
            operacao = operadores[i].simbolo;
            numero1 = Number(visor.value);
            visor.value = "";
        }
    }

    let botao_resultado = document.getElementById("resultado");

    botao_resultado.onclick = function(){
        numero2 = Number(visor.value);

        if (operacao == "+"){
            resultado = numero1 + numero2; 
        } else if (operacao == "-"){
            resultado = numero1 - numero2;
        } else if (operacao == "*"){
            resultado = numero1 * numero2;
        } else if (operacao == "/"){
            if (numero2 == 0){
                visor.value = "Indeterminado";
                return;
            } else {
                resultado = numero1 / numero2;
            }
        } else {
            return;
        }

        visor.value = resultado;
        numero1 = resultado;
        numero2 = null;
        operacao = null;
    }

    let botao_limpar = document.getElementById("limpar");

    botao_limpar.onclick = function(){
        visor.value = "";
        numero1 = null;
        numero2 = null;
        operacao = null;
        resultado = null;
    }
</script>
</body>
</html>
